@if (pwaService.isOnline()) {
  <app-activity-input />
  <app-activities-details [userScores]="userScores()" />
} @else {
  @if (!nerdModeActive()) {
    <div class="nerd-mode-container">
      <button mat-raised-button color="accent" (click)="nerdModeActive.set(true)">
        {{ 'gemCalculator.nerdModeButton' | translate }}
      </button>
    </div>
  } @else {
    <app-gem-calculator (back)="nerdModeActive.set(false)" />
  }
}
