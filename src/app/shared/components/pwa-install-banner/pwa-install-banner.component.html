@if (isVisible()) {
  <div class="pwa-install-banner" role="banner">
    <span class="banner-message">{{ 'pwa.install' | translate }}</span>
    <div class="banner-actions">
      <button mat-flat-button color="primary" (click)="install()">
        {{ 'pwa.install' | translate }}
      </button>
      <button mat-icon-button (click)="dismiss()" [attr.aria-label]="'pwa.installDismiss' | translate">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
}
