<button
  [type]="type()"
  [disabled]="disabled() || submitting()"
  [color]="color()"
  [class]="buttonClass()"
  mat-raised-button
  (click)="handleClick()"
>
  @if (submitting()) {
    <mat-spinner diameter="20"></mat-spinner>
    <span>{{ loadingText() }}</span>
  } @else {
    @if (icon()) {
      <mat-icon>{{ icon() }}</mat-icon>
    }
    <span>{{ text() }}</span>
  }
</button>
